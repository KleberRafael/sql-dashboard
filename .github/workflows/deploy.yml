name: Deploy SQL Dashboard

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.json"
      - "data-*.json"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site
        run: |
          mkdir -p site
          cp index.html site/
          # copia o manifesto (lista de instancias)
          if [ -f manifest.json ]; then cp manifest.json site/; fi
          # copia TODOS os arquivos de dados por instancia
          cp data-*.json site/ 2>/dev/null || echo "nenhum data-*.json encontrado ainda"
          # compatibilidade: se ainda existir o data.json antigo, copia tambem
          if [ -f data.json ]; then cp data.json site/; fi
          echo "--- conteudo do site ---"
          ls -la site/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
